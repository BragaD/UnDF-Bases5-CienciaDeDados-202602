<style>
/* ------------------------------------------------------------------ *
 * Tokens — os mesmos das outras páginas de apoio/, para todas serem
 * visivelmente irmãs. Fundo e texto do tema `cosmo`; azuis do logo da UnDF.
 *
 * A regra de leitura também é a mesma: azul é o que está parado, laranja
 * é o que está mudando (o corte em teste, o galho novo).
 * ------------------------------------------------------------------ */
:root{
  color-scheme: light;

  --paper:    #FFFFFF;
  --paper-2:  #EEF4FA;
  --panel:    #FFFFFF;
  --ink:      #373A3C;
  --ink-2:    #5B6B76;
  --ink-3:    #8A99A5;
  --rule:     #DCE5EE;
  --grid:     #EDF2F7;

  --marca:    #2264AF;
  --ajuste:   #D9480F;

  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --r: 3px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:   #12161B;
    --paper-2: #1A2430;
    --panel:   #171F27;
    --ink:     #E6ECF2;
    --ink-2:   #9BAAB8;
    --ink-3:   #6E7F8D;
    --rule:    #2A3743;
    --grid:    #202B35;
    --marca:   #6FB0E8;
    --ajuste:  #FF7A45;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:   #12161B;
  --paper-2: #1A2430;
  --panel:   #171F27;
  --ink:     #E6ECF2;
  --ink-2:   #9BAAB8;
  --ink-3:   #6E7F8D;
  --rule:    #2A3743;
  --grid:    #202B35;
  --marca:   #6FB0E8;
  --ajuste:  #FF7A45;
}

*{ box-sizing: border-box; }
[hidden]{ display: none !important; }

body{
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

:focus-visible{ outline: 2px solid var(--marca); outline-offset: 2px; }

.app{
  max-width: 1360px;
  margin: 0 auto;
  padding: 22px 24px 40px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.topbar{
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--rule);
}

.eyebrow{
  margin: 0 0 2px;
  font-family: var(--cond);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink-3);
}

h1{
  margin: 0;
  font-family: var(--cond);
  font-weight: 600;
  font-size: clamp(26px, 3.4vw, 38px);
  line-height: 1.04;
  letter-spacing: -.005em;
  text-wrap: balance;
}
</style>
