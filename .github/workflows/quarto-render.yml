name: Render and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build da imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bragad/undf-bases5-ciencia-de-dados-202602:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testes:
    name: Invariantes estruturais
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/bragad/undf-bases5-ciencia-de-dados-202602:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Marcar workspace como seguro para o git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: pytest
        run: pytest tests/ -v

  offline:
    name: Render offline (sem rede)
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # Roda num runner comum (não em `container:`), porque precisa passar
    # --network none para o `docker run` que executa a imagem — dentro de um
    # `container:` do próprio job não há como isolar a rede da imagem
    # interna dessa forma. Um checkout novo não tem `_freeze/` (gitignorado),
    # então já começa frio por construção: sem cache para reaproveitar, o
    # quarto render é obrigado a executar os chunks de verdade, e qualquer
    # chamada de rede estoura em vez de passar em silêncio. Isto é o guard
    # automático que faltava para a invariante "nenhum byte vem da rede em
    # tempo de render" — sem ele, um capítulo futuro que buscasse algo da
    # rede no render passaria verde no CI para sempre.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull da imagem
        run: docker pull ghcr.io/bragad/undf-bases5-ciencia-de-dados-202602:latest

      - name: Render sem rede
        run: |
          docker run --rm --network none -e HOME=/tmp \
            -v "$PWD":/livro -w /livro \
            ghcr.io/bragad/undf-bases5-ciencia-de-dados-202602:latest \
            quarto render

  render:
    name: Renderizar o livro
    needs: [testes, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/bragad/undf-bases5-ciencia-de-dados-202602:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Marcar workspace como seguro para o git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Render
        run: quarto render

      - name: Upload do livro renderizado
        uses: actions/upload-artifact@v4
        with:
          name: livro
          path: _book/
          retention-days: 7

  publish:
    name: Publicar no GitHub Pages
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download do livro renderizado
        uses: actions/download-artifact@v4
        with:
          name: livro
          path: _book

      - name: Publicar na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
          publish_branch: gh-pages
