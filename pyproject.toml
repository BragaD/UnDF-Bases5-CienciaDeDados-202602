[project]
name = "bases5-ciencia-de-dados"
version = "0.1.0"
description = "Livro Quarto — Bases 5: Ciência de Dados (UnDF)"
requires-python = ">=3.12"
# Limites de versão: o uv.lock trava as versões exatas, mas um `make lock`
# futuro resolveria livremente e poderia puxar uma versão incompatível. No
# livro irmão (bases_3_estatistica) isso não é teórico: o pandas 3 mudou o
# dtype padrão de texto e quebrou dois exemplos SEM levantar exceção — apenas
# devolvendo a resposta errada.
#
# Pacotes 0.x levam limite no MINOR, não na major: em SemVer pré-1.0 é o minor
# que carrega mudança incompatível, então "<1" não protegeria nada.
#
# Ementa nova (spec docs/superpowers/specs/2026-09-10-estrutura-nova-islp-
# design.md): os caps. 1–5 continuam em Python puro (`scratch/`, sem numpy
# nem scikit-learn em chunk que executa — só em callouts que não rodam). A
# partir do cap. 6, `pandas` é a mesa de trabalho dos dados (ler, tipar,
# limpar, agrupar, apresentar) e, a partir do cap. 7 (o lab 2.3 do ISLP),
# `numpy` é a calculadora de array. Do cap. 7 em diante o `scikit-learn` é
# a ferramenta de ponta a ponta — fit/predict/Pipeline — e não um enfeite
# de callout: é ele que ajusta e avalia o modelo, capítulo após capítulo.
dependencies = [
    "jupyter>=1,<2",              # Quarto executa chunks Python via jupyter
    "matplotlib>=3,<4",           # cap. 3 e todo gráfico do livro, ISLP inclusive
    "numpy>=2,<3",                # a partir do cap. 7 (ISLP 2.3): array, fatia, máscara, redução
    "pandas>=2,<3",               # a partir do cap. 6: ler, tipar, limpar, agrupar, apresentar dado
    "scipy>=1,<2",                # smoothing splines do ISLP 2 (o sklearn não tem)
    "tqdm>=4,<5",                 # sobrou da abordagem antiga — nenhum capítulo atual usa
    "requests>=2,<3",             # sobrou da abordagem antiga — nenhum capítulo atual usa
    "beautifulsoup4>=4,<5",       # sobrou da abordagem antiga — nenhum capítulo atual usa
    "html5lib>=1,<2",             # sobrou da abordagem antiga — nenhum capítulo atual usa
    "python-dateutil>=2,<3",      # sobrou da abordagem antiga — nenhum capítulo atual usa
    "pillow>=11,<12",             # sobrou da abordagem antiga — nenhum capítulo atual usa
    "scikit-learn>=1,<2",         # a partir do cap. 7: a ferramenta de ponta a ponta da disciplina
    "pytest>=8,<9",               # suíte de invariantes estruturais
]

[tool.uv]
package = false
