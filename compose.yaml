services:
  livro:
    build:
      context: .
    image: bases5-ciencia-de-dados:local
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - HOME=/tmp
    ports:
      - "4201:4201"
      # JupyterLab dos notebooks de aula (make jupyter). Preso em 127.0.0.1
      # de propósito: o alvo sobe o Lab sem token, e sem esse prefixo o Docker
      # publicaria em 0.0.0.0 — execução de código aberta para a rede da sala.
      - "127.0.0.1:8901:8901"
    volumes:
      - .:/livro
