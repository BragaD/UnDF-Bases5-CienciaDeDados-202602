project:
  type: book
  output-dir: _book
  execute-dir: project
  # Copiado para _book/ e publicado junto com o livro. Só a versão do aluno das
  # atividades mora em atividades/publico/; o gabarito fica fora, e o
  # test_atividades.py trava isso.
  resources:
    - atividades/publico/*.pdf
    # Página interativa de gradiente descendente, usada ao vivo na aula do
    # capítulo 5. Não é conteúdo do livro (não tem .qmd, não entra no sidebar):
    # é um arquivo estático que o Quarto só copia para _book/apoio/, e o
    # index.qmd do capítulo 5 aponta para ela pela URL do site publicado.
    - apoio/gradiente-descendente.html
    - apoio/lote-minibatch-estocastico.html
    # Página interativa da seção 7.6: a flexibilidade contra o erro, com a
    # decomposição viés-variância. Mesma natureza das duas acima.
    - apoio/flexibilidade-e-erro.html
    # Página interativa da seção 7.6: reta, parábola e polinômios de grau 3,
    # 6 e 14 sobre 15 pontos de uma cúbica, com o ruído num slider.
    - apoio/polinomios-e-ruido.html

execute:
  freeze: auto

jupyter: python3

lang: pt

# Cada seção é uma página, e o Quarto trata cada página de livro como um
# "capítulo": com o padrão (chapters: true), a figura sai com o número de ordem
# da página no livro inteiro ("Figura 43.1" na seção 8.1). Sem a opção, cada
# página numera as próprias figuras a partir de 1. Nenhuma página usa @fig-,
# então nada depende do prefixo. number-offset não muda esse número (testado).
crossref:
  chapters: false

