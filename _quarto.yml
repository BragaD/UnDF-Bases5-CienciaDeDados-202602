  page-footer:
    border: true
    left: "UnDF — Ciência da Computação — Ciência de Dados — 2026.2"
    right:
      - icon: github
        href: "https://github.com/BragaD/UnDF-Bases5-CienciaDeDados-202602"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    number-sections: false
    # No <head>, e não no fim do body, de propósito: o script lê o localStorage
    # e aplica a classe antes do primeiro paint. Movido para depois do body,
    # as barras laterais aparecem e somem a cada troca de página.
    include-in-header: modo-leitura.html
    include-after-body: spoiler.html
    toc: true
    toc-depth: 4
    toc-title: "Nesta página"
    link-external-icon: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap

bibliography: references.bib

editor: source
code-annotations: hover

author:
  - name: "Douglas Braga"
    email: "douglas.braga@undf.edu.br"
